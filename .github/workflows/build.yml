name: Build VoiceInk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Resolve whisper.cpp revision
        id: whisper
        run: echo "sha=$(git ls-remote https://github.com/ggml-org/whisper.cpp.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache whisper.xcframework
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: ~/VoiceInk-Dependencies
          key: whisper-macos-only-${{ hashFiles('scripts/ci/whisper-macos-only.py') }}-${{ steps.whisper.outputs.sha }}

      - name: Build whisper.xcframework
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/VoiceInk-Dependencies
          git clone https://github.com/ggml-org/whisper.cpp.git ~/VoiceInk-Dependencies/whisper.cpp
          cd ~/VoiceInk-Dependencies/whisper.cpp
          git checkout ${{ steps.whisper.outputs.sha }}
          # Build only the macOS slice (skip iOS / visionOS / tvOS)
          python3 -I "$GITHUB_WORKSPACE/scripts/ci/whisper-macos-only.py" build-xcframework.sh
          ./build-xcframework.sh

      - name: Build app (ad-hoc signed)
        run: make local LOCAL_CODESIGN_IDENTITY=-

      - name: Package
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" ~/Downloads/VoiceInk.app/Contents/Info.plist)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          ditto -c -k --keepParent ~/Downloads/VoiceInk.app "dist/VoiceInk-$VERSION-${GITHUB_SHA::7}.zip"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInk-${{ env.VERSION }}-${{ github.run_number }}
          path: dist/*.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            Ad-hoc signed build of VoiceInk ${{ env.VERSION }}.
            After unzipping run: `xattr -cr VoiceInk.app` before first launch.
